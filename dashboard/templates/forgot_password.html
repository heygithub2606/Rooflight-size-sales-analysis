<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }

        input[type="email"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            border-color: #007bff;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .messages {
            margin-top: 20px;
        }

        .messages p {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .messages p.success {
            background-color: #d4edda;
            color: #155724;
        }

        .messages p.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .text-center {
            text-align: center;
            margin-top: 10px;
        }
        .btn-submit {
        background-color: #003366;  /* Navy blue background */
        color: white;  /* White text color */
        border: none;  /* Removes border */
        padding: 10px 20px;  /* Padding for button size */
        font-size: 1rem;  /* Font size for the text */
        border-radius: 8px;  /* Rounded corners */
        cursor: pointer;  /* Pointer cursor on hover */
        transition: background-color 0.3s ease;  /* Smooth background color transition */
    }

    .btn-submit:hover {
        background-color: #002240;  /* Darker navy blue when hovered */
    }

    .btn-submit:active {
        background-color: #001933;  /* Even darker navy blue when clicked */
    }

    </style>
</head>
<body>

    <div class="container">
        <h2>Forgot Password</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="email">Enter your email:</label>
            <input type="email" name="email" required>
            <button type="submit" class="btn btn-submit">Submit</button>
            <p class="text-center mt-3">Back to Login? <a href="{% url 'login' %}">login </a></p>
        </form>

        <!-- Display messages for success or errors -->
        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                    
                {% endfor %}
            {% endif %}
        </div>
    </div>

</body>
</html>
