{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Reset Body Padding and Margin */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000; /* Fallback color */
        }

        /* Video Fullscreen without Padding */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill; /* Stretches video to cover entire screen */
            z-index: -1;
        }

        /* Content Wrapper */
        .content-wrapper {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            max-width: 300px;
            padding: 20px;
            border-radius: 10px;
        }

        .content-wrapper p {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
        }

        /* Button Styling */
        .enter-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn {
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #2980b9, #3498db);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        /* Media Queries for Small Screens */
        @media (max-width: 768px) {
            .content-wrapper {
                max-width: 250px;
                padding: 15px;
            }

            .content-wrapper p {
                font-size: 1.2rem;
            }

            .enter-button {
                font-size: 1rem;
                padding: 10px 20px;
            }
        }

        @media (max-width: 480px) {
            .content-wrapper {
                max-width: 200px;
                padding: 10px;
            }

            .content-wrapper p {
                font-size: 1rem;
            }

            .enter-button {
                font-size: 0.9rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video class="video-background" src="{% static 'media/video.mp4' %}" autoplay loop muted></video>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <p>Get Start Now</p>
        <a href="{% url 'register' %}" class="btn btn-primary enter-button">
            <i class="fas fa-arrow-right"></i> Let's Go
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
